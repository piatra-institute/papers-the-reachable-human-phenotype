- id: scope-25
  kind: computation
  passage: The proposal is that capability, embodiment, agency and identity are coordinates of one measurable
    object; that the object is state-dependent and only partly explored; that the phenomena that look
    strangest from outside occupy some of its most informative regions; and that the experiment that would
    settle the current question is crossed and needs about 25 participants per group, compared with the
    20 typical of the field, before multiple groups and outcome families are added.
  evidence:
    file: simulation/output/results.json
    run_id: reachable
    pointer: /design/n_per_group_for_80pct_fine
    reported: '25'
    units: participants per group
    conditions: diagnostic interaction, effect 0.45, per-participant scan 20-30
    decimals: 0
- id: yamamura
  kind: source
  passage: The strongest reason to keep the coordinates separate is a 2026 experiment in which 24 participants
    received virtual cat ears with congruent visual, tactile and auditory manipulation.
  evidence:
    citation_id: yamamura2026
    locator: Abstract
    verified: true
    verification_note: DOI 10.3389/frvir.2026.1817800; the abstract reports 24 participants and visual,
      haptic and auditory manipulation of cat ears.
- id: yamamura-result
  kind: source
  passage: Subjective ownership of the ears rose and touch and sound were referred to them, while proprioceptive
    drift did not change [@yamamura2026].
  evidence:
    citation_id: yamamura2026
    locator: Abstract (Results)
    verified: true
    verification_note: The abstract reports increased ownership and referral of touch and audio to the
      cat ears, and no significant proprioceptive-drift effects.
- id: khan
  kind: source
  passage: A study the same year found that active and passive haptics increased the sense of embodiment
    of virtual dog ears in 28 participants [@khan2026].
  evidence:
    citation_id: khan2026
    locator: Abstract
    verified: true
    verification_note: 'arXiv:2606.26364 abstract (DataCite): 2x2 within-subjects study, n = 28, active
      and passive haptics for virtual dog ears; passive haptics produced the strongest embodiment.'
- id: mottelson
  kind: source
  passage: A meta-analysis of 111 articles also reports modest ownership effects, somewhat stronger agency
    effects, and widespread problems with power and inconsistent terminology [@mottelson2023].
  evidence:
    citation_id: mottelson2023
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1145/3590767; the abstract: 111 articles, modest body ownership, slightly
      higher agency, lack of statistical power and of clarity in terminology.'
- id: roberts
  kind: source
  passage: Liking an animal and identifying as one are psychometrically separable, as a self-binding account
    requires [@roberts2015].
  evidence:
    citation_id: roberts2015
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1080/08927936.2015.1069993; OpenAlex abstract: three-factor Species Connection
      Scale separating liking, spiritual connection and identification.'
- id: palmercooper
  kind: source
  passage: Among 243 participants across tulpamancy, ASMR and comparison groups, tulpamancers showed unusual
    sensory experience without a general elevation in delusion-proneness [@palmercooper2021], and experienced
    autonomy of characters also occurs among adult fiction writers [@taylor2003].
  evidence:
    citation_id: palmercooper2021
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1080/13546805.2021.1999798; OpenAlex abstract: 243 participants; higher
      hallucination-proneness in the Tulpamancer+ group and no group differences in delusion-proneness.'
- id: taylor
  kind: source
  passage: Among 243 participants across tulpamancy, ASMR and comparison groups, tulpamancers showed unusual
    sensory experience without a general elevation in delusion-proneness [@palmercooper2021], and experienced
    autonomy of characters also occurs among adult fiction writers [@taylor2003].
  evidence:
