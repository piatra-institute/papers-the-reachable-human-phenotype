    locator: Abstract
    verified: true
    verification_note: 'DOI 10.2190/FTG3-Q9T0-7U26-5Q5X; the abstract: 92% of fifty fiction writers reported
      some illusion of independent agency of their characters.'
- id: kranjec
  kind: source
  passage: Taken at face value, it contradicts the global-plasticity account.
  evidence:
    citation_id: kranjec2019
    locator: Abstract
    verified: true
    verification_note: 'OpenAlex abstract of the eScholarship record 37x5162v: furries felt less subjective
      embodiment than non-furries, supporting the identification hypothesis over the malleable-self hypothesis.'
- id: samad
  kind: source
  passage: Body ownership can be modeled as inference about whether visual and proprioceptive evidence
    share a common bodily cause [@samad2015].
  evidence:
    citation_id: samad2015
    locator: Abstract
    verified: true
    verification_note: DOI 10.1371/journal.pone.0117178; OpenAlex abstract applies the Bayesian causal
      inference model to visual, proprioceptive and tactile stimuli and reproduces the RHI.
- id: curran
  kind: source
  passage: An early prospective study of 30 febrile and 30 afebrile autistic children found transient
    reductions on several aberrant-behavior measures during fever [@curran2007].
  evidence:
    citation_id: curran2007
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1542/peds.2007-0360; the abstract: 30 febrile children with 30 matched
      afebrile controls, fewer aberrant behaviours on several subscales during fever, all improvements
      transient.'
- id: guterstam
  kind: source
  passage: Ownership extends to a third arm [@guterstam2011], to supernumerary robotic limbs whose incorporation
    appears in peripersonal-space measures as well as questionnaires [@arai2022], and to avatars with
    nonhuman morphology that participants learn to control [@won2015; @krekhov2019].
  evidence:
    citation_id: guterstam2011
    locator: Abstract
    verified: true
    verification_note: DOI 10.1371/journal.pone.0017208 (supernumerary hand illusion); Arai et al. 10.1038/s41598-022-13981-w
      (embodiment of supernumerary robotic limbs with crossmodal-congruency peripersonal measure); Won
      et al. 10.1111/jcc4.12107 (control of novel bodies); Krekhov et al. 10.1109/CIG.2019.8848005 (ownership
      of animal avatars). Abstracts via Crossref/OpenAlex.
- id: yee
  kind: source
  passage: 'Avatars also alter later behavior: people given taller or more attractive virtual bodies behave
    differently afterward [@yee2007].'
  evidence:
    citation_id: yee2007
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1111/j.1468-2958.2007.00299.x; OpenAlex abstract: more attractive avatars
      more intimate, taller avatars more confident in negotiation.'
- id: seth
  kind: source
  passage: Bodily self-consciousness already decomposes into ownership, self-location and first-person
    perspective, which dissociate under different manipulations [@blanke2015], and the owning self is
    itself inferred, partly from interoceptive prediction [@seth2013].
  evidence:
    citation_id: seth2013
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1016/j.tics.2013.09.007; OpenAlex abstract: interoceptive inference sheds
      light on body ownership and conscious selfhood.'
- id: def-phenotype
  kind: definition
  passage: We call that space the reachable human phenotype, the set of behavioral and phenomenological
    configurations a nervous system can enter through physiological change, sensory perturbation, learning
    and context.
  rationale: Defines the central object as a set of reachable configurations.
- id: def-coordinates
  kind: definition
  passage: 'We propose ten coordinates: capability, body ownership, body schema, self-location, agency,
    identity, memory access, perceptual organization, affect and reality testing.'
  rationale: Stipulated factorisation, justified by dissociations in the literature.
- id: def-safe
  kind: definition
  passage: The safely reachable phenotype is the set of configurations attainable under bounded, ethically
    permissible perturbations within a horizon, a reachable set in the control-theoretic sense with safety
    imposed as a hard constraint.
  rationale: Control-theoretic reachable set with safety as a hard constraint.
- id: asm-prior
  kind: assumption
  passage: We add a prior over morphological correspondence, so that the readiness with which an effector
    is taken as part of the body depends on how well its form matches the participant's self-model.
  rationale: The morphology-congruence prior is the model's one added parameter.
- id: asm-theories
  kind: assumption
  passage: Three theories are under consideration.
  rationale: Model selection is restricted to three generative theories.
- id: asm-multiscale
  kind: assumption
  passage: The formalism separates a fast neural and physiological state driven by perturbation, stable
    individual traits, and slowly learned generative-model parameters that accumulate from the fast state
    and decay when it stops.
  rationale: Timescale separation is a modelling choice.
- id: int-chance
  kind: interpretation
  passage: With a single human effector, recovery is 0.51 against a chance level of 0.33.
  rationale: Chance level is one in three theories.
- id: int-same-param
  kind: interpretation
  passage: 'The same parameter produces both signs, and the prediction is testable: participants who bind
    a human hand less should bind a congruent nonhuman body more.'
  rationale: Follows from the single prior shift in the binding model.
- id: int-could-not
  kind: interpretation
  passage: The one direct study uses this design, so it could not have distinguished the account it appears
    to refute from the account it supports.
  rationale: Reading of the human-only confusion matrix.
- id: int-small-disc
  kind: interpretation
  passage: At small discrepancy the ownership change dominates and drift barely moves; at large discrepancy
    drift dominates (Figure 1, right).
  rationale: Drift/ownership gain ratio 0.41 at discrepancy 0.5 rising to 3.3 at 4 (results.json /binding/dissociation_sweep).
- id: int-invariants
  kind: interpretation
  passage: The simulation, its 3 figures and every model number quoted above regenerate from one command
    in the repository (`simulation/run_all.py`; seeded, bit for bit). 22 invariants fail the run if broken,
    among them the human-only design's failure to discriminate and its misreading of congruent binding,
    the crossed design's recovery, the monotone power curve, the per-participant scan bracketed by the
    coarse grid, the closed-form sample size for the SELF and OTHER crossing, the two-sign property with
    its neutral-morphology control, the ownership-over-drift regime at small discrepancy and its reversal
    at large, positive but incomplete hysteresis, the crossed form of the double dissociation, and the
    trained region exceeding the fast-driven baseline.
  rationale: Count of entries in results.json /checks (22).
- id: int-objection
  kind: interpretation
  passage: The strongest objection is that the simulations contain no people, so the numbers are properties
    of assumptions.
  rationale: States the epistemic status of every simulated number.
- id: norm-community
  kind: normative
  passage: The communities discussed here are not a resource for cognitive science, and three commitments
    follow.
  rationale: Ethical commitments governing the proposed research.
- id: norm-decisive
  kind: normative
  passage: The protocol's decisive test is an identity-congruent interaction in at least one subjective
    measure and at least one behavioral, physiological or psychophysical measure, since a questionnaire
    difference alone cannot distinguish a changed body model from a changed expectation.
  rationale: Requirement for a behavioural or physiological measure alongside questionnaires.
runs:
- id: reachable
  required: true
  record: verification/reachable.json
